# Instancia LOCAL completa, en Docker: postgres, redis, el CMS y la web.
#
# Para ver el motor funcionando de punta a punta sin tocar ningún servidor. No
# es el de producción —ese vive en deploy/templates/ y va detrás de un proxy
# con TLS—: acá los puertos se publican en localhost y los secretos son de
# juguete, generados por scripts/local-up.sh.
#
#   ./scripts/local-up.sh          levanta todo
#   docker compose -f docker-compose.local.yml logs -f cms
#   docker compose -f docker-compose.local.yml down -v     borra también los datos

name: nib-local

services:
  postgres:
    image: postgres:18-alpine
    container_name: nib-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nib
      POSTGRES_USER: nib
      POSTGRES_PASSWORD: nib
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nib"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nib-local-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    container_name: nib-local-cms
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: nib
      DATABASE_USERNAME: nib
      DATABASE_PASSWORD: nib
      DATABASE_SSL: "false"
      APP_KEYS: "${STRAPI_APP_KEYS:?correr scripts/local-up.sh}"
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT:?}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET:?}
      JWT_SECRET: ${STRAPI_JWT_SECRET:?}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT:?}
      ENCRYPTION_KEY: ${STRAPI_ENCRYPTION_KEY:?}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?}
      PREVIEW_SECRET: ${PREVIEW_SECRET:?}
      PREVIEW_WEB_URL: http://localhost:3400
      # La identidad de la instalación. En producción PROJECT_SLUG es
      # obligatoria por una razón seria (ver apps/cms/src/lib/project.ts).
      PROJECT_SLUG: nib
      PROJECT_NAME: Nib
      SITE_PUBLIC_URL: http://localhost:3400
      # Sin clave de OpenAI el panel entero funciona; lo único que no corre es
      # la generación de notas y portadas.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ADMIN_KEY: ${OPENAI_ADMIN_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      REDIS_URL: redis://redis:6379
      CORS_ALLOWED_ORIGINS: http://localhost:3400
      URL: http://localhost:1340
      ADMIN_URL: /admin
      STRAPI_TELEMETRY_DISABLED: "true"
      NODE_ENV: production
      # Los crons quedan apagados: una instancia de prueba no tiene por qué
      # salir a pedirle feeds a nadie apenas arranca.
      CRON_ENABLED: "false"
    ports:
      - "127.0.0.1:1340:1337"
    volumes:
      - cms-uploads:/repo/apps/cms/public/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nib-local-web
    restart: unless-stopped
    depends_on:
      - cms
    environment:
      # Dentro de la red de compose el CMS es "cms". El navegador nunca usa
      # esta URL: los assets se sirven por el rewrite /cms/* de la web.
      CMS_URL: http://cms:1337
      NEXT_PUBLIC_CMS_URL: http://cms:1337
      NEXT_PUBLIC_SITE_URL: http://localhost:3400
      NEXT_PUBLIC_SITE_NAME: Nib
      CMS_PREVIEW_SECRET: ${PREVIEW_SECRET:?}
      NODE_ENV: production
    ports:
      - "127.0.0.1:3400:3000"

volumes:
  postgres-data:
  redis-data:
  cms-uploads:
