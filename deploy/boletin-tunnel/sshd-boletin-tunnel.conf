# Túneles de salida argentina para el Boletín Oficial (codelo).
# Ver deploy/boletin-tunnel/README.md en el repo de codelo.
#
# Sólo afecta al usuario boletin-tunnel; setup-vps.sh comprueba que la
# configuración efectiva de los demás usuarios no cambie antes de recargar.
Match User boletin-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    # Sólo -R (las PCs publican su proxy acá), nunca -L: con -L este usuario
    # podría usar el VPS para llegar a la base o a Redis.
    AllowTcpForwarding remote
    PermitOpen none
    # Escuchar en la IP de docker0 (y no en loopback) es lo que deja que el
    # container del CMS llegue al túnel. Sólo esos puertos; cada clave además
    # queda atada al suyo en authorized_keys.
    GatewayPorts clientspecified
    PermitListen 172.17.0.1:18881 172.17.0.1:18882
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTTY no
    ForceCommand /usr/sbin/nologin
    # Un túnel cortado de golpe (PC apagada, cambio de IP del router) libera
    # su puerto en ~45 s, en vez de los 6 min del default de este server.
    ClientAliveInterval 15
    ClientAliveCountMax 3
