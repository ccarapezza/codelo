# TEMPLATE. Copiar a la raíz del proyecto como docker-compose.prod.yml.
# Todo lo específico viene del .env que Jenkins renderiza: no hay defaults
# con el nombre de ningún proyecto, a propósito — un default silencioso es
# cómo un proyecto termina escribiendo sobre los datos de otro.
# Production stack for Cogollos del Oeste (domain TBD).
#
# Deployed via Jenkins (`westcode-shared` shared library, `deployDockerCompose`).
# The `.env` file in the repo dir is rendered by Jenkins from Jenkins
# credentials + non-secret defaults on each pipeline run — do not commit it.
#
# Reverse proxy + TLS are handled by the shared Caddy living in `/opt/proxy`
# on the host (shared with the fulbo/x100 stacks). The `web` and `cms`
# services attach to the external `proxy-edge` network so the shared Caddy
# can reach them by container name (codelo-web, codelo-cms).
#
# No Prisma/migrate service here: Strapi manages its own schema on boot.
#
# Tail logs:
#   docker compose -f docker-compose.prod.yml logs -f web cms

x-restart-policy: &restart_policy
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    container_name: ${PROJECT_SLUG:?required}-postgres
    <<: *restart_policy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    # postgres:18+ stores data in a major-version-specific subdirectory of
    # /var/lib/postgresql — mount the parent dir (see docker-library/postgres#1259).
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?required}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_SLUG:?required}-redis
    <<: *restart_policy
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD required}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

  # Strapi headless CMS — admin UI + REST API
  cms:
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    container_name: ${PROJECT_SLUG:?required}-cms
    <<: *restart_policy
    # The VPS (8GB) also hosts fulbo and x100 — keep limits modest.
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 384M
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:?required}
      DATABASE_USERNAME: ${POSTGRES_USER:?required}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
      APP_KEYS: ${STRAPI_APP_KEYS:?required}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT:?required}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET:?required}
      JWT_SECRET: ${STRAPI_JWT_SECRET:?required}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT:?required}
      ENCRYPTION_KEY: ${STRAPI_ENCRYPTION_KEY:?required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?required}
      # Vista previa de borradores (página Notas → iframe de la web). El mismo
      # secreto lo comparte codelo-web como CMS_PREVIEW_SECRET. PREVIEW_WEB_URL
      # habilita además el frame-src de la CSP del admin (ver middlewares.ts).
      PREVIEW_SECRET: ${PREVIEW_SECRET:?PREVIEW_SECRET required}
      PREVIEW_WEB_URL: ${SITE_PUBLIC_URL:?required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?required}
      OPENAI_IMAGE_API_KEY: ${OPENAI_IMAGE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?required}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      # Public URL behind Caddy (used in admin emails, oembeds, etc.)
      URL: ${CMS_PUBLIC_URL:?required}
      ADMIN_URL: /admin
      # Identidad de la instalación. PROJECT_SLUG NO tiene default: con ella se
      # arman las claves del core store, y una equivocada haría que una migración
      # de arranque ya cumplida se crea pendiente (ver src/lib/project.ts).
      PROJECT_SLUG: ${PROJECT_SLUG:?required}
      PROJECT_NAME: ${PROJECT_NAME:?required}
      STRAPI_TELEMETRY_DISABLED: "true"
      NODE_ENV: production
    volumes:
      - cms-uploads:/repo/apps/cms/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, proxy-edge]

  # Next.js public site — codelo-web
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # frame-ancestors (CSP) se hornea en build: pasamos el origen del CMS
        # para permitir el iframe de "Vista previa" del panel en prod.
        PREVIEW_FRAME_ANCESTOR: ${CMS_PUBLIC_URL:?required}
    container_name: ${PROJECT_SLUG:?required}-web
    <<: *restart_policy
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    environment:
      CMS_URL: http://cms:1337
      NEXT_PUBLIC_CMS_URL: ${CMS_PUBLIC_URL:?required}
      NEXT_PUBLIC_SITE_URL: ${SITE_PUBLIC_URL:?required}
      # Vista previa de borradores: mismo secreto que el CMS (PREVIEW_SECRET).
      CMS_PREVIEW_SECRET: ${PREVIEW_SECRET:?PREVIEW_SECRET required}
      NODE_ENV: production
    depends_on:
      cms:
        condition: service_started
    networks: [internal, proxy-edge]

networks:
  internal:
    name: ${PROJECT_SLUG:?required}-internal
  proxy-edge:
    external: true

volumes:
  postgres-data:
  redis-data:
  cms-uploads:
